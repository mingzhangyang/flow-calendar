<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26232A">
<title>流动日历</title>
</head>
<body>
<h1 class="sr-only">流动日历</h1>
<main class="stage">
  <canvas id="world" role="img" aria-label="远足视图"></canvas>
  <button id="viewing" class="viewing" type="button">
    <span class="when"></span><span class="back">回到现在</span>
  </button>
  <div id="modes" class="modes" role="group" aria-label="模式">
    <button type="button" data-mode="hike" aria-pressed="true">远足</button>
    <button type="button" data-mode="climb" aria-pressed="false">登山</button>
    <button type="button" data-mode="farm" aria-pressed="false">农场</button>
  </div>
  <button id="goal-btn" class="goal-btn" type="button" hidden>设目标</button>
  <button id="open-list" class="open-list" type="button">列表</button>
  <button id="add" class="add" type="button"><span aria-hidden="true">＋</span>新建</button>
  <button id="overview" class="overview" type="button" aria-pressed="false" hidden>回望</button>
  <p id="note" class="note" hidden></p>
</main>
<dialog id="list" class="list" aria-label="日程列表">
  <header>
    <h2 tabindex="-1">日程列表</h2>
    <button type="button" class="import">导入日历</button>
    <button type="button" class="close">回到画面</button>
    <input type="file" class="import-file" accept=".ics,text/calendar" hidden>
  </header>
  <p class="msg" role="status" hidden></p>
  <input class="search" type="search" placeholder="搜索标题、备注、准备事项、结论" aria-label="搜索日程" autocomplete="off" enterkeyhint="search">
  <div class="tabs" role="group" aria-label="显示哪些日程">
    <button type="button" data-tab="next" aria-pressed="true">接下来</button>
    <button type="button" data-tab="past" aria-pressed="false">过去</button>
    <span class="status" role="status" aria-live="polite"></span>
  </div>
  <div class="groups"></div>
  <p class="empty" hidden></p>
</dialog>
<dialog id="sheet" class="sheet">
  <section class="detail" hidden>
    <p class="state"></p>
    <h2 class="title"></h2>
    <p class="when"></p>
    <p class="notes"></p>
    <div class="prep" hidden>
      <h3>准备事项</h3>
      <ul class="checks"></ul>
    </div>
    <div class="outcome" hidden>
      <h3>结论</h3>
      <p class="outcome-text"></p>
      <textarea class="outcome-input" rows="2" maxlength="500" placeholder="这次怎么样？写一两句。" aria-label="结论"></textarea>
      <div class="outcome-actions"><button type="button" class="outcome-btn">记下</button></div>
    </div>
    <div class="actions">
      <button type="button" class="del">删除</button>
      <span class="grow"></span>
      <button type="button" class="close">关闭</button>
      <button type="button" class="edit primary">编辑</button>
    </div>
  </section>
  <form class="form" hidden novalidate>
    <h2 class="form-title">新建日程</h2>
    <label>标题<input name="title" maxlength="100" autocomplete="off" enterkeyhint="done"></label>
    <label>日期<input name="date" type="date"></label>
    <div class="row">
      <label>开始<input name="start" type="time"></label>
      <label>结束<input name="end" type="time"></label>
    </div>
    <label>备注<textarea name="notes" rows="3" maxlength="2000"></textarea></label>
    <label>准备事项（每行一条）<textarea name="prep" rows="3" maxlength="2000" placeholder="例如：带上上周的数据"></textarea></label>
    <p class="error" role="alert"></p>
    <div class="actions">
      <span class="grow"></span>
      <button type="button" class="cancel">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>
<dialog id="goal" class="sheet" aria-label="登山的目标">
  <form class="form" novalidate>
    <h2>目标</h2>
    <p class="hint">山顶的旗插在截止日。做过的事一层层垒起来，一步步往那里爬。</p>
    <label>目标<input name="title" maxlength="40" autocomplete="off" enterkeyhint="done" placeholder="例如：新版上线"></label>
    <label>截止日<input name="date" type="date"></label>
    <p class="error" role="alert"></p>
    <div class="actions">
      <button type="button" class="clear del">清除目标</button>
      <span class="grow"></span>
      <button type="button" class="cancel">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
